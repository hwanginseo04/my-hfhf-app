name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create Space and Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          
          token = os.environ.get('HF_TOKEN')
          api = HfApi(token=token)
          
          repo_id = 'inseo37099/my-hfhf-app'
          
          try:
              api.create_repo(
                  repo_id=repo_id,
                  repo_type='space',
                  space_sdk='gradio',
                  private=False
              )
              print(f'Space {repo_id} created successfully!')
          except Exception as e:
              print(f'Repo might already exist or error occurred: {e}')

          api.upload_folder(
              folder_path='.',
              repo_id=repo_id,
              repo_type='space',
          )
          print('Successfully uploaded code to Hugging Face Space!')
          "
          